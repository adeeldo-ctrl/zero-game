name: ZERO GAME Android APK

on:
  # APK assembly is final-only: manual dispatch or the one-time marker added after integrated CI passes.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ZERO_GAME_FINAL_RELEASE_TRIGGER.md

permissions:
  contents: read

jobs:
  build-android:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout verified source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Enforce final-only delivery lock
        run: |
          if ! grep -qx 'FINAL_RELEASE_APPROVED: true' ZERO_GAME_FINAL_DELIVERY_LOCK.md; then
            echo "Final Android Release APK is locked until all development and consolidated verification are complete."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found under $ANDROID_HOME"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run automated game-data tests
        run: npm test

      - name: Validate original PNG enemy and boss artwork
        run: npm run art:validate

      - name: Run lint
        run: npm run lint

      - name: Validate Android configuration
        run: python3 scripts/validate-android-config.py

      - name: Build web game
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install headless browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test all campaign stages and mobile controls
        run: node scripts/smoke-game-browser.mjs

      - name: Create Android project when absent
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Install ZERO GAME launcher icon
        run: python3 scripts/install-android-icon.py

      - name: Force Android game into landscape orientation
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          launcher = None
          for activity in root.findall("application/activity"):
              for intent_filter in activity.findall("intent-filter"):
                  actions = [node.get(android + "name") for node in intent_filter.findall("action")]
                  categories = [node.get(android + "name") for node in intent_filter.findall("category")]
                  if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in categories:
                      launcher = activity
                      break
              if launcher is not None:
                  break
          if launcher is None:
              raise SystemExit("Could not find the Android launcher activity")
          launcher.set(android + "screenOrientation", "landscape")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Launcher activity is locked to landscape orientation.")
          PY

      - name: Hide Android system bars for immersive full-screen play
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          candidates = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if not candidates:
              raise SystemExit("MainActivity.java was not generated by Capacitor")
          activity = candidates[0]
          source = activity.read_text(encoding="utf-8")
          package_match = re.search(r"^package\s+([\w.]+);", source, re.M)
          if not package_match:
              raise SystemExit("Could not determine MainActivity package")
          package = package_match.group(1)
          activity.write_text(f'''package {package};

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  applyImmersiveMode();
              }}

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {{
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) applyImmersiveMode();
              }}

              private void applyImmersiveMode() {{
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }}
          }}
          ''', encoding="utf-8")
          print(f"Enabled immersive full-screen mode in {activity}")
          PY

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Create one-time release signing key
        shell: bash
        run: |
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$KEYSTORE_PASSWORD"
          echo "ZERO_GAME_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ZERO_GAME_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/zero-game-release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias zero-game \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ZERO GAME, OU=Mobile, O=ZERO GAME, L=Karachi, ST=Sindh, C=PK"

      - name: Align and sign release APK
        shell: bash
        run: |
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*-unsigned.apk' -print -quit)"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Gradle did not produce an unsigned release APK"
            exit 1
          fi
          ALIGNED_APK="$RUNNER_TEMP/zero-game-release-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/zero-game-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/zero-game-release.keystore" \
            --ks-key-alias zero-game \
            --ks-pass "pass:$ZERO_GAME_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ZERO_GAME_KEY_PASSWORD" \
            --out "$SIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK"
          test -s "$SIGNED_APK"

      - name: Upload final release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-game-release-apk
          path: android/app/build/outputs/apk/release/zero-game-release.apk
          if-no-files-found: error
          retention-days: 14
