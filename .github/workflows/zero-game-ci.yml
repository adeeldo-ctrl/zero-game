name: ZERO GAME Continuous Checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and validate game
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Validate Android configuration without building an APK
        run: python3 scripts/validate-android-config.py

      - name: Build web game
        run: npm run build
