name: ZERO GAME Continuous Checks

on:
  # Run one consolidated verification when the final source/verification configuration changes.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zero-game-ci.yml"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "ZERO_GAME_UPGRADE_MASTER_PLAN.md"
      - "ZERO_GAME_FINAL_DELIVERY_LOCK.md"

permissions:
  contents: write

concurrency:
  group: zero-game-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and validate game
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare transparent enemy reference cutouts
        run: npm run art:prepare-reference

      - name: Commit generated transparent enemy and boss cutouts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/enemies/prepared-reference src/assets/bosses/prepared-reference
          if ! git diff --cached --quiet; then
            git commit -m "Add generated transparent enemy and enlarged boss cutouts"
            git push
          fi

      - name: Upload prepared enemy reference cutouts
        uses: actions/upload-artifact@v4
        with:
          name: zero-game-prepared-enemy-references
          path: |
            src/assets/enemies/prepared-reference/
            src/assets/bosses/prepared-reference/
          if-no-files-found: error
          retention-days: 7

      - name: Run automated tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Validate Android configuration without building an APK
        run: python3 scripts/validate-android-config.py

      - name: Build web game
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install headless browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test campaign in Chromium
        run: node scripts/smoke-game-browser.mjs
