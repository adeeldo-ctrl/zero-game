name: ZERO GAME Continuous Checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-game-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and validate game
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Validate Android configuration without building an APK
        run: python3 scripts/validate-android-config.py

      - name: Build web game
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install headless browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test campaign in Chromium
        run: node scripts/smoke-game-browser.mjs
